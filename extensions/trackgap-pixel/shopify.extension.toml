# TrackGap web pixel extension.
#
# Runs on the storefront and in checkout, in an isolated sandbox. The merchant
# neither edits nor installs it; Shopify activates it when the app is installed.
#
# Purpose: read the GA4 client_id from the _ga cookie and ad click IDs from the
# URL so a backfilled conversion is attributed to the right visit. Without it
# the conversion would end up as direct/none, which is worse than missing.

api_version = "2026-07"

[[extensions]]
name = "TrackGap identity"
handle = "trackgap-pixel"
uid = "3ceeeb9e-2022-385d-7fd3-7195781d6742b521a901"
type = "web_pixel_extension"
runtime_context = "strict"

[extensions.customer_privacy]
# Without consent the pixel does not run; Shopify enforces this via the
# Customer Privacy API. Hence the UI reports "could not backfill: customer declined consent".
analytics = true
marketing = true
preferences = false
sale_of_data = "enabled"

[extensions.settings]
type = "object"

  [extensions.settings.fields.endpoint]
  name = "Endpoint"
  description = "Where the pixel reports identity"
  type = "single_line_text_field"

  [extensions.settings.fields.measurementId]
  name = "GA4 Measurement ID"
  description = "Used to read the GA4 session cookie"
  type = "single_line_text_field"
