# TrackGap - Shopify app configuration
#
# client_id is the app's public identifier (not a secret).
# The app secret belongs in .env (SHOPIFY_API_SECRET) or .secrets/shopify.json; never in git.
# Example config: replace client_id and trackgap.example.com with your own values.

name = "TrackGap"
handle = "trackgap"
client_id = "YOUR_SHOPIFY_CLIENT_ID"
application_url = "https://trackgap.example.com"
embedded = true

[access_scopes]
# read_orders is protected customer data (Level 1 is enough: no name, e-mail,
# address or phone). read_pixels is needed to find and update the existing
# pixel. write_pixels + read_customer_events: without them the pixel cannot
# be activated
# and we get no GA4 client_id -> conversion backfill would not work.
scopes = "read_orders,read_pixels,write_pixels,read_customer_events"

[auth]
redirect_urls = [
  "https://trackgap.example.com/auth/callback",
  "https://trackgap.example.com/auth/shopify/callback"
]

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "orders/create", "orders/updated" ]
  uri = "https://trackgap.example.com/webhooks/orders"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "https://trackgap.example.com/webhooks/app"

  [[webhooks.subscriptions]]
  topics = [ "app_subscriptions/update" ]
  uri = "https://trackgap.example.com/webhooks/billing"

  # GDPR compliance webhooks have their own section; they do NOT belong in subscriptions.
  # Otherwise deploy fails with "The following topic is invalid".
  [webhooks.privacy_compliance]
  customer_data_request_url = "https://trackgap.example.com/webhooks/gdpr"
  customer_deletion_url = "https://trackgap.example.com/webhooks/gdpr"
  shop_deletion_url = "https://trackgap.example.com/webhooks/gdpr"

# App Proxy: /apps/trackgap on the store domain -> our server.
# This gives the pixel a first-party path that ad blockers and ITP do not block.
# Every request is signed (`signature`) and verified in shopify.mjs.
[app_proxy]
url = "https://trackgap.example.com/proxy"
subpath = "trackgap"
prefix = "apps"

[pos]
embedded = false

[build]
