# TrackGap — Shopify app configuration
#
# client_id je verejny identifikator appky (nie tajomstvo).
# App secret patri do .env (SHOPIFY_API_SECRET) alebo .secrets/shopify.json; do gitu nejde.
# Example config: nahrad client_id a trackgap.example.com vlastnymi hodnotami.

name = "TrackGap"
handle = "trackgap"
client_id = "YOUR_SHOPIFY_CLIENT_ID"
application_url = "https://trackgap.example.com"
embedded = true

[access_scopes]
# read_orders je protected customer data (Level 1 staci — bez mena, mailu,
# adresy a telefonu). read_pixels je potrebny na najdenie a aktualizaciu
# existujuceho pixelu. write_pixels + read_customer_events: bez nich sa pixel
# neda aktivovat
# a neziskame GA4 client_id -> doplnanie konverzii by nefungovalo.
scopes = "read_orders,read_pixels,write_pixels,read_customer_events"

[auth]
redirect_urls = [
  "https://trackgap.example.com/auth/callback",
  "https://trackgap.example.com/auth/shopify/callback"
]

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "orders/create", "orders/updated" ]
  uri = "https://trackgap.example.com/webhooks/orders"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "https://trackgap.example.com/webhooks/app"

  [[webhooks.subscriptions]]
  topics = [ "app_subscriptions/update" ]
  uri = "https://trackgap.example.com/webhooks/billing"

  # GDPR compliance webhooky maju vlastnu sekciu — do subscriptions NEPATRIA.
  # Overene 31.8.2026: deploy padne na "The following topic is invalid".
  [webhooks.privacy_compliance]
  customer_data_request_url = "https://trackgap.example.com/webhooks/gdpr"
  customer_deletion_url = "https://trackgap.example.com/webhooks/gdpr"
  shop_deletion_url = "https://trackgap.example.com/webhooks/gdpr"

# App Proxy: /apps/trackgap na domene obchodu -> nas server.
# Vdaka tomu ide pixel first-party cestou, ktoru neblokuju adblockery ani ITP.
# Kazda poziadavka je podpisana (`signature`) a overuje sa v shopify.mjs.
[app_proxy]
url = "https://trackgap.example.com/proxy"
subpath = "trackgap"
prefix = "apps"

[pos]
embedded = false

[build]
